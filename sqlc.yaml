version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/postgres"
    queries: "internal/product/queries/query.sql"
    gen:
      go:
        package: "sqlc"
        out: "internal/product/repository/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true

